openapi: 3.1.0
info:
  title: PromptChain API Contract
  description: PromptChain 统一接口规范（v1），由当前 FastAPI app 导出，并补充 WebSocket/SSE 文档扩展。
  version: 1.0.0
paths:
  /api/workflow/start:
    post:
      tags:
      - workflow
      summary: Start Workflow
      description: '启动新的内容生成工作流


        工作流会在需要用户输入时暂停：

        - needs_clarification: 需要澄清信息

        - awaiting_outline_approval: 等待提纲审批'
      operationId: start_workflow_api_workflow_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/pause:
    post:
      tags:
      - workflow
      summary: Pause Workflow
      description: 用户主动暂停工作流
      operationId: pause_workflow_api_workflow__workflow_run_id__pause_post
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseWorkflowRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/resume:
    post:
      tags:
      - workflow
      summary: Resume Workflow
      description: 恢复用户手动暂停的工作流
      operationId: resume_workflow_api_workflow__workflow_run_id__resume_post
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeWorkflowRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/approve-outline:
    post:
      tags:
      - workflow
      summary: Approve Outline
      description: '处理提纲审批


        action 可选值：

        - approve: 确认提纲

        - modify: 修改提纲（需提供 modified_outline）

        - regenerate: 重新生成（可提供 feedback）'
      operationId: approve_outline_api_workflow__workflow_run_id__approve_outline_post
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveOutlineRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/clarify:
    post:
      tags:
      - workflow
      summary: Clarify Intent
      description: 提供澄清回答
      operationId: clarify_intent_api_workflow__workflow_run_id__clarify_post
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarifyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/approve-fact-check:
    post:
      tags:
      - workflow
      summary: Approve Fact Check
      description: 处理事实核查高风险项审批
      operationId: approve_fact_check_api_workflow__workflow_run_id__approve_fact_check_post
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveFactCheckRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/runs:
    get:
      tags:
      - workflow
      summary: List Workflow Runs
      description: 获取当前用户在当前工作空间可见的运行记录列表。
      operationId: list_workflow_runs_api_workflow_runs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunListResponse'
  /api/workflow/{workflow_run_id}/events:
    get:
      tags:
      - workflow
      summary: Stream Workflow Events
      description: 通过 SSE 向详情页推送运行状态和 trace 快照。
      operationId: stream_workflow_events_api_workflow__workflow_run_id__events_get
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}:
    get:
      tags:
      - workflow
      summary: Get Workflow Status
      description: 获取工作流状态
      operationId: get_workflow_status_api_workflow__workflow_run_id__get
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/rerun-options:
    get:
      tags:
      - workflow
      summary: Get Rerun Options
      description: 获取可重跑的节点列表
      operationId: get_rerun_options_api_workflow__workflow_run_id__rerun_options_get
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/rerun:
    post:
      tags:
      - workflow
      summary: Rerun Workflow
      description: '从指定节点重跑工作流


        创建新的工作流运行，保留指定节点之前的所有 Artifact'
      operationId: rerun_workflow_api_workflow__workflow_run_id__rerun_post
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/rerun-history:
    get:
      tags:
      - workflow
      summary: Get Rerun History
      description: 获取工作流的重跑历史
      operationId: get_rerun_history_api_workflow__workflow_run_id__rerun_history_get
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/{workflow_run_id}/exports/docx:
    get:
      tags:
      - workflow
      summary: Export Workflow Docx
      description: 导出已完成工作流的最终产物 DOCX。
      operationId: export_workflow_docx_api_workflow__workflow_run_id__exports_docx_get
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/trace/{workflow_run_id}:
    get:
      tags:
      - trace
      summary: Get Workflow Trace
      description: 获取工作流完整追踪
      operationId: get_workflow_trace_api_trace__workflow_run_id__get
      parameters:
      - name: workflow_run_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/trace/node/{node_run_id}:
    get:
      tags:
      - trace
      summary: Get Node Detail
      description: 获取节点运行详情
      operationId: get_node_detail_api_trace_node__node_run_id__get
      parameters:
      - name: node_run_id
        in: path
        required: true
        schema:
          type: string
          title: Node Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/artifact/{artifact_id}:
    get:
      tags:
      - trace
      summary: Get Artifact
      description: 获取 Artifact 详情
      operationId: get_artifact_api_artifact__artifact_id__get
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          title: Artifact Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/artifact/{artifact_id}/history:
    get:
      tags:
      - trace
      summary: Get Artifact History
      description: 获取 Artifact 版本历史
      operationId: get_artifact_history_api_artifact__artifact_id__history_get
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          title: Artifact Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: '用户注册


        注册成功后会发送验证邮件，用户需要验证邮箱后才能登录'
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: '用户登录


        登录成功后会在 Cookie 中设置 access_token 和 refresh_token'
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Token
      description: '刷新 Access Token


        使用 Cookie 中的 refresh_token 获取新的 access_token'
      operationId: refresh_token_api_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RefreshRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: '用户登出


        撤销 Refresh Token 并清除 Cookie'
      operationId: logout_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/auth/verify-email:
    post:
      tags:
      - auth
      summary: Verify Email
      description: '验证邮箱


        使用邮件中的验证链接完成邮箱验证'
      operationId: verify_email_api_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/resend-verification-email:
    post:
      tags:
      - auth
      summary: Resend Verification Email
      description: '重发验证邮件


        仅对未验证用户重发，其他情况返回中性成功，避免暴露账号状态。'
      operationId: resend_verification_email_api_auth_resend_verification_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/forgot-password:
    post:
      tags:
      - auth
      summary: Forgot Password
      description: '忘记密码


        发送密码重置邮件'
      operationId: forgot_password_api_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/reset-password:
    post:
      tags:
      - auth
      summary: Reset Password
      description: '重置密码


        使用邮件中的重置链接设置新密码'
      operationId: reset_password_api_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/me:
    get:
      tags:
      - auth
      summary: Get Me
      description: '获取当前用户信息


        返回当前登录用户的信息及其工作空间列表'
      operationId: get_me_api_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/workspaces:
    get:
      tags:
      - workspace
      summary: List Workspaces
      description: 获取当前用户的所有工作空间
      operationId: list_workspaces_api_workspaces_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - workspace
      summary: Create Workspace
      description: '创建新的工作空间


        创建者自动成为 Owner'
      operationId: create_workspace_api_workspaces_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{workspace_id}:
    get:
      tags:
      - workspace
      summary: Get Workspace
      description: 获取工作空间详情
      operationId: get_workspace_api_workspaces__workspace_id__get
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - workspace
      summary: Update Workspace
      description: '更新工作空间信息


        需要 workspace.update 权限'
      operationId: update_workspace_api_workspaces__workspace_id__patch
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{workspace_id}/members:
    get:
      tags:
      - workspace
      summary: List Members
      description: 获取工作空间成员列表
      operationId: list_members_api_workspaces__workspace_id__members_get
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{workspace_id}/invite:
    post:
      tags:
      - workspace
      summary: Invite Member
      description: '邀请成员加入工作空间


        需要 member.manage 权限'
      operationId: invite_member_api_workspaces__workspace_id__invite_post
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/accept-invite:
    post:
      tags:
      - workspace
      summary: Accept Invite
      description: 接受工作空间邀请
      operationId: accept_invite_api_workspaces_accept_invite_post
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/memberships/{membership_id}:
    patch:
      tags:
      - workspace
      summary: Update Member Role
      description: '更新成员角色


        需要 member.manage 权限'
      operationId: update_member_role_api_memberships__membership_id__patch
      parameters:
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          title: Membership Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - workspace
      summary: Remove Member
      description: '移除成员


        需要 member.manage 权限，不能移除 Owner'
      operationId: remove_member_api_memberships__membership_id__delete
      parameters:
      - name: membership_id
        in: path
        required: true
        schema:
          type: string
          title: Membership Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspace-context/switch:
    post:
      tags:
      - workspace
