components:
  schemas:
    ApiKeyCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        scopes:
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          type: array
          title: Scopes
        expires_in_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires In Days
          description: 有效期（天），不填则永不过期
      type: object
      required:
      - name
      title: ApiKeyCreate
      description: 创建 API Key
    ApiKeyScope:
      type: string
      enum:
      - read
      - write
      - execute
      - all
      title: ApiKeyScope
      description: API Key 权限范围
    ApproveFactCheckRequest:
      properties:
        decisions:
          additionalProperties:
            type: string
            enum:
            - confirm
            - use_suggestion
            - manual
          type: object
          title: Decisions
        manual_corrections:
          additionalProperties:
            type: string
          type: object
          title: Manual Corrections
      type: object
      required:
      - decisions
      title: ApproveFactCheckRequest
      description: 事实核查审批请求
    ApproveOutlineRequest:
      properties:
        action:
          type: string
          enum:
          - approve
          - modify
          - regenerate
          title: Action
        feedback:
          anyOf:
          - type: string
          - type: 'null'
          title: Feedback
          default: ''
        modified_outline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Modified Outline
      type: object
      required:
      - action
      title: ApproveOutlineRequest
      description: 提纲审批请求
    ClarifyRequest:
