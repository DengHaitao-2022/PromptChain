services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: promptchain-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-promptchain}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: promptchain-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: promptchain-prod-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-promptchain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: promptchain-prod-minio-init
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-promptchain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      KNOWLEDGE_S3_BUCKET: ${KNOWLEDGE_S3_BUCKET:-promptchain-knowledge}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$KNOWLEDGE_S3_BUCKET"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
    container_name: promptchain-prod-backend
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-promptchain}
      REDIS_URL: redis://redis:6379/0
      WORKFLOW_EVENT_BUS_BACKEND: ${WORKFLOW_EVENT_BUS_BACKEND:-redis}
      WORKFLOW_EVENT_BUS_REDIS_CHANNEL_PREFIX: ${WORKFLOW_EVENT_BUS_REDIS_CHANNEL_PREFIX:-promptchain:workflow-events}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-anthropic}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-claude-3-5-sonnet-20241022}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_MODEL_TOKEN: ${GITHUB_MODEL_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-hash}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-promptchain-hash-embedding-v1}
      KNOWLEDGE_EMBEDDING_DIMENSION: ${KNOWLEDGE_EMBEDDING_DIMENSION:-1536}
      KNOWLEDGE_EMBEDDING_FALLBACK_TO_HASH: ${KNOWLEDGE_EMBEDDING_FALLBACK_TO_HASH:-true}
      KNOWLEDGE_ALLOW_EXTERNAL_EMBEDDING_FOR_PRIVATE_SCOPES: ${KNOWLEDGE_ALLOW_EXTERNAL_EMBEDDING_FOR_PRIVATE_SCOPES:-false}
      KNOWLEDGE_OBJECT_STORAGE_BACKEND: ${KNOWLEDGE_OBJECT_STORAGE_BACKEND:-s3}
      KNOWLEDGE_S3_BUCKET: ${KNOWLEDGE_S3_BUCKET:-promptchain-knowledge}
      KNOWLEDGE_S3_ENDPOINT_URL: ${KNOWLEDGE_S3_ENDPOINT_URL:-http://minio:9000}
      KNOWLEDGE_S3_REGION: ${KNOWLEDGE_S3_REGION:-us-east-1}
      KNOWLEDGE_S3_ACCESS_KEY_ID: ${KNOWLEDGE_S3_ACCESS_KEY_ID:?KNOWLEDGE_S3_ACCESS_KEY_ID is required}
      KNOWLEDGE_S3_SECRET_ACCESS_KEY: ${KNOWLEDGE_S3_SECRET_ACCESS_KEY:?KNOWLEDGE_S3_SECRET_ACCESS_KEY is required}
      KNOWLEDGE_S3_PREFIX: ${KNOWLEDGE_S3_PREFIX:-knowledge}
      KNOWLEDGE_S3_FORCE_PATH_STYLE: ${KNOWLEDGE_S3_FORCE_PATH_STYLE:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@promptchain.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}
      EMAIL_DEV_LOG_BODY: ${EMAIL_DEV_LOG_BODY:-false}
      KNOWLEDGE_STORAGE_DIR: ${KNOWLEDGE_STORAGE_DIR:-/app/.data/knowledge}
      KNOWLEDGE_MAX_UPLOAD_BYTES: ${KNOWLEDGE_MAX_UPLOAD_BYTES:-20971520}
      KNOWLEDGE_MAX_DOCUMENTS_PER_KB: ${KNOWLEDGE_MAX_DOCUMENTS_PER_KB:-200}
      KNOWLEDGE_INDEX_WORKER_ENABLED: "false"
      KNOWLEDGE_INDEX_WORKER_INTERVAL_SECONDS: ${KNOWLEDGE_INDEX_WORKER_INTERVAL_SECONDS:-2}
      KNOWLEDGE_INDEX_WORKER_BATCH_SIZE: ${KNOWLEDGE_INDEX_WORKER_BATCH_SIZE:-5}
      KNOWLEDGE_INDEX_WORKER_STALE_SECONDS: ${KNOWLEDGE_INDEX_WORKER_STALE_SECONDS:-900}
      KNOWLEDGE_INDEX_QUEUE_BACKEND: ${KNOWLEDGE_INDEX_QUEUE_BACKEND:-redis}
      KNOWLEDGE_INDEX_QUEUE_REDIS_STREAM: ${KNOWLEDGE_INDEX_QUEUE_REDIS_STREAM:-promptchain:knowledge-index}
      KNOWLEDGE_INDEX_QUEUE_REDIS_GROUP: ${KNOWLEDGE_INDEX_QUEUE_REDIS_GROUP:-knowledge-index-workers}
      KNOWLEDGE_INDEX_QUEUE_BLOCK_MS: ${KNOWLEDGE_INDEX_QUEUE_BLOCK_MS:-1000}
      KNOWLEDGE_INDEX_QUEUE_MAXLEN: ${KNOWLEDGE_INDEX_QUEUE_MAXLEN:-10000}
      KNOWLEDGE_GENERATION_EVAL_PROVIDER: ${KNOWLEDGE_GENERATION_EVAL_PROVIDER:-heuristic}
      KNOWLEDGE_GENERATION_EVAL_ALLOW_EXTERNAL_JUDGE: ${KNOWLEDGE_GENERATION_EVAL_ALLOW_EXTERNAL_JUDGE:-false}
      KNOWLEDGE_RAGAS_MODEL: ${KNOWLEDGE_RAGAS_MODEL:-gpt-4o-mini}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - knowledge_data:/app/.data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  knowledge-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
    container_name: promptchain-prod-knowledge-worker
    restart: unless-stopped
    command: ["python", "-m", "services.knowledge_index_worker"]
    environment:
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-promptchain}
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-anthropic}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-claude-3-5-sonnet-20241022}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_MODEL_TOKEN: ${GITHUB_MODEL_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-hash}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-promptchain-hash-embedding-v1}
      KNOWLEDGE_EMBEDDING_DIMENSION: ${KNOWLEDGE_EMBEDDING_DIMENSION:-1536}
      KNOWLEDGE_EMBEDDING_FALLBACK_TO_HASH: ${KNOWLEDGE_EMBEDDING_FALLBACK_TO_HASH:-true}
      KNOWLEDGE_ALLOW_EXTERNAL_EMBEDDING_FOR_PRIVATE_SCOPES: ${KNOWLEDGE_ALLOW_EXTERNAL_EMBEDDING_FOR_PRIVATE_SCOPES:-false}
      KNOWLEDGE_OBJECT_STORAGE_BACKEND: ${KNOWLEDGE_OBJECT_STORAGE_BACKEND:-s3}
      KNOWLEDGE_S3_BUCKET: ${KNOWLEDGE_S3_BUCKET:-promptchain-knowledge}
      KNOWLEDGE_S3_ENDPOINT_URL: ${KNOWLEDGE_S3_ENDPOINT_URL:-http://minio:9000}
      KNOWLEDGE_S3_REGION: ${KNOWLEDGE_S3_REGION:-us-east-1}
      KNOWLEDGE_S3_ACCESS_KEY_ID: ${KNOWLEDGE_S3_ACCESS_KEY_ID:?KNOWLEDGE_S3_ACCESS_KEY_ID is required}
      KNOWLEDGE_S3_SECRET_ACCESS_KEY: ${KNOWLEDGE_S3_SECRET_ACCESS_KEY:?KNOWLEDGE_S3_SECRET_ACCESS_KEY is required}
      KNOWLEDGE_S3_PREFIX: ${KNOWLEDGE_S3_PREFIX:-knowledge}
      KNOWLEDGE_S3_FORCE_PATH_STYLE: ${KNOWLEDGE_S3_FORCE_PATH_STYLE:-true}
      KNOWLEDGE_STORAGE_DIR: ${KNOWLEDGE_STORAGE_DIR:-/app/.data/knowledge}
      KNOWLEDGE_MAX_UPLOAD_BYTES: ${KNOWLEDGE_MAX_UPLOAD_BYTES:-20971520}
      KNOWLEDGE_MAX_DOCUMENTS_PER_KB: ${KNOWLEDGE_MAX_DOCUMENTS_PER_KB:-200}
      KNOWLEDGE_INDEX_WORKER_ENABLED: ${KNOWLEDGE_INDEX_WORKER_ENABLED:-true}
      KNOWLEDGE_INDEX_WORKER_INTERVAL_SECONDS: ${KNOWLEDGE_INDEX_WORKER_INTERVAL_SECONDS:-2}
      KNOWLEDGE_INDEX_WORKER_BATCH_SIZE: ${KNOWLEDGE_INDEX_WORKER_BATCH_SIZE:-5}
      KNOWLEDGE_INDEX_WORKER_STALE_SECONDS: ${KNOWLEDGE_INDEX_WORKER_STALE_SECONDS:-900}
      KNOWLEDGE_INDEX_QUEUE_BACKEND: ${KNOWLEDGE_INDEX_QUEUE_BACKEND:-redis}
      KNOWLEDGE_INDEX_QUEUE_REDIS_STREAM: ${KNOWLEDGE_INDEX_QUEUE_REDIS_STREAM:-promptchain:knowledge-index}
      KNOWLEDGE_INDEX_QUEUE_REDIS_GROUP: ${KNOWLEDGE_INDEX_QUEUE_REDIS_GROUP:-knowledge-index-workers}
      KNOWLEDGE_INDEX_QUEUE_BLOCK_MS: ${KNOWLEDGE_INDEX_QUEUE_BLOCK_MS:-1000}
      KNOWLEDGE_INDEX_QUEUE_MAXLEN: ${KNOWLEDGE_INDEX_QUEUE_MAXLEN:-10000}
    volumes:
      - knowledge_data:/app/.data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: promptchain-prod-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  knowledge_data:
  minio_data:
