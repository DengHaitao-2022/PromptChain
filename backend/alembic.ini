[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
timezone = UTC

# 实际连接串优先读取环境变量 DATABASE_URL；这里保留开发默认值，便于本地执行。
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/promptchain

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
