[project]
name = "promptchain-backend"
version = "0.1.0"
description = "PromptChain Backend - AI工作流编排后端服务"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # 核心依赖
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    # LangChain 生态
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    # 数据库
    "aiosqlite>=0.19.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "greenlet>=3.0.0",
    # 验证与安全
    # 认证与加密
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt<4.1",
    "cryptography>=43.0.0",
    "email-validator>=2.1.0",
    "aiosmtplib>=3.0.0",
    # 工具库
    "httpx>=0.26.0",
    "deepdiff>=6.7.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.6",
    "pytest>=9.0.2",
    "langchain-ollama>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
