# Ruff 配置文件 - Python代码质量工具
# 文档: https://docs.astral.sh/ruff/

target-version = "py314"

src = ["backend"]

line-length = 100

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]

ignore = [
    "E501",   # 行过长 (由formatter处理)
    "B008",   # 函数调用中的默认参数
    "UP007",  # 使用X|Y联合类型 (保持兼容性)

    "RUF002", # 中文 docstring 中允许中文全角标点
    "RUF003", # 中文注释中允许中文全角标点
]

[lint.per-file-ignores]
"**/__init__.py" = ["F401", "RUF022"]

[format]
quote-style = "double"
indent-style = "space"
