# Ruff 配置文件 - Python代码质量工具
# 文档: https://docs.astral.sh/ruff/

# 目标Python版本
target-version = "py314"

# 后端采用 flat package 布局，显式声明源根以稳定一方包导入排序
src = ["backend"]

# 每行最大字符数
line-length = 100

[lint]
# 启用的规则集
select = [
    "E",   # pycodestyle错误
    "W",   # pycodestyle警告
    "F",   # Pyflakes
    "I",   # isort (import排序)
    "N",   # pep8命名规范
    "UP",  # pyupgrade (现代化Python语法)
    "B",   # flake8-bugbear (常见bug模式)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff特定规则
]

# 忽略的规则
ignore = [
    "E501",   # 行过长 (由formatter处理)
    "B008",   # 函数调用中的默认参数
    "UP007",  # 使用X|Y联合类型 (保持兼容性)

    "RUF002", # 中文 docstring 中允许中文全角标点
    "RUF003", # 中文注释中允许中文全角标点
]

# LangChain / Agent 项目中，中文 prompt、中文用户提示、中文 Pydantic 描述属于业务内容，
# 允许常见中文标点，避免 RUF001 对自然语言字符串产生大量误报。
allowed-confusables = [
    "，",
    "。",
    "、",
    "；",
    "：",
    "？",
    "！",
    "（",
    "）",
    "【",
    "】",
    "《",
    "》",
    "“",
    "”",
    "‘",
    "’",
    "—",
    "…",
]

# 每个文件可忽略的规则
[lint.per-file-ignores]
"**/__init__.py" = ["F401", "RUF022"]  # 允许导出聚合和按模块分组的 __all__

[format]
# 使用双引号
quote-style = "double"

# 缩进风格
indent-style = "space"
