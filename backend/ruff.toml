# Ruff 配置文件 - Python代码质量工具
# 文档: https://docs.astral.sh/ruff/

# 目标Python版本
target-version = "py314"

# 每行最大字符数
line-length = 100

[lint]
# 启用的规则集
select = [
    "E",   # pycodestyle错误
    "W",   # pycodestyle警告
    "F",   # Pyflakes
    "I",   # isort (import排序)
    "N",   # pep8命名规范
    "UP",  # pyupgrade (现代化Python语法)
    "B",   # flake8-bugbear (常见bug模式)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff特定规则
]

# 忽略的规则
ignore = [
    "E501",  # 行过长 (由formatter处理)
    "B008",  # 函数调用中的默认参数
    "UP007", # 使用X|Y联合类型 (保持兼容性)
]

# 允许中文注释/docstring中出现的全角符号，避免 RUF002 / RUF003 误报
allowed-confusables = ["，", "（", "）"]

# 每个文件可忽略的规则
[lint.per-file-ignores]
"__init__.py" = ["F401"]  # 允许未使用的导入

[format]
# 使用双引号
quote-style = "double"

# 缩进风格
indent-style = "space"
