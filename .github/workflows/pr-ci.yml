name: PR CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 安装后端依赖
        run: uv sync --all-extras --dev --no-install-project

      - name: Ruff 检查
        run: uvx ruff check .

      - name: Pytest
        run: uv run pytest

  frontend:
    name: 前端质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: Next.js 构建
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
