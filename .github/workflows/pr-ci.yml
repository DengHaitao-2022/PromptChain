name: PR CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 变更范围识别
    runs-on: ubuntu-latest
    outputs:
      backend-python: ${{ steps.filter.outputs.backend_python }}
      frontend-source: ${{ steps.filter.outputs.frontend_source }}
      backend-migrations: ${{ steps.filter.outputs.backend_migrations }}
      e2e-source: ${{ steps.filter.outputs.e2e_source }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 识别本次 PR 变更范围
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          base_sha="${BASE_SHA}"
          head_sha="${HEAD_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${head_sha}^")"
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"
          printf '%s\n' "${changed_files}"

          backend_python=false
          backend_migrations=false
          frontend_source=false
          e2e_source=false

          if printf '%s\n' "${changed_files}" | grep -Eq '^backend/.*\.py$'; then
            backend_python=true
          fi

          if printf '%s\n' "${changed_files}" | grep -Eq '^(backend/alembic/|backend/alembic\.ini|backend/orm/|backend/models/.*_orm\.py|backend/db/postgres_store\.py)'; then
            backend_migrations=true
          fi

          if printf '%s\n' "${changed_files}" | grep -Eq '^(frontend/src/|frontend/tests/e2e/|frontend/(eslint\.config\.mjs|next\.config\.ts|tsconfig\.json|package(-lock)?\.json|playwright\.config\.ts))'; then
            frontend_source=true
          fi

          if printf '%s\n' "${changed_files}" | grep -Eq '^(frontend/tests/e2e/|frontend/playwright\.config\.ts|frontend/package(-lock)?\.json)'; then
            e2e_source=true
          fi

          echo "backend_python=${backend_python}" >> "${GITHUB_OUTPUT}"
          echo "backend_migrations=${backend_migrations}" >> "${GITHUB_OUTPUT}"
          echo "frontend_source=${frontend_source}" >> "${GITHUB_OUTPUT}"
          echo "e2e_source=${e2e_source}" >> "${GITHUB_OUTPUT}"

  infrastructure:
    name: 基础设施配置检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 YAML 文件
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file); puts "ok #{file}" }' \
            .github/workflows/pr-ci.yml \
            .github/workflows/codeql.yml \
            docker-compose.prod.yml

      - name: 校验生产 Compose 配置
        env:
          POSTGRES_PASSWORD: local-check
          MINIO_ROOT_PASSWORD: local-check-minio-root
          KNOWLEDGE_S3_ACCESS_KEY_ID: local-check-s3-access-key
          KNOWLEDGE_S3_SECRET_ACCESS_KEY: local-check-s3-secret-key
          JWT_SECRET_KEY: local-check-jwt-secret
          SECRETS_ENCRYPTION_KEY: local-check-secrets-encryption-key
        run: docker compose -f docker-compose.prod.yml config

  backend:
    name: 后端质量检查
    runs-on: ubuntu-latest
    needs:
      - changes

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff 检查
        if: needs.changes.outputs.backend-python == 'true'
        run: uvx ruff==0.14.10 check backend --config backend/ruff.toml

      - name: Ruff 格式检查
        if: needs.changes.outputs.backend-python == 'true'
        run: uvx ruff==0.14.10 format backend --check --config backend/ruff.toml

      - name: Pytest 检查
        if: needs.changes.outputs.backend-python == 'true'
        working-directory: backend
        env:
          ALLOW_INSECURE_JWT_SECRET: "true"
          DATABASE_AUTO_SCHEMA_INIT: "true"
        run: uv run pytest tests -q

      - name: 跳过 Ruff 检查说明
        if: needs.changes.outputs.backend-python != 'true'
        run: echo "本次 PR 未修改 backend/**/*.py，跳过后端 Ruff gate；基础设施配置检查仍会阻塞。"

  migrations:
    name: 生产迁移流水线检查
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.backend-migrations == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptchain_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promptchain_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Alembic 升级检查
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/promptchain_ci
          ALLOW_INSECURE_JWT_SECRET: "true"
          DATABASE_AUTO_SCHEMA_INIT: "false"
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d promptchain_ci -c 'CREATE EXTENSION IF NOT EXISTS vector'
          uv run alembic heads
          uv run alembic upgrade head

      - name: Alembic 回滚冒烟
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/promptchain_ci
          ALLOW_INSECURE_JWT_SECRET: "true"
          DATABASE_AUTO_SCHEMA_INIT: "false"
        run: |
          # Alembic merge revision 对 `downgrade -1` 会产生 Ambiguous walk，需显式解析父 revision。
          rollback_target="$(uv run python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          if len(heads) != 1:
              raise SystemExit(f"期望只有一个 Alembic head，实际为: {', '.join(heads)}")

          head = script.get_revision(heads[0])
          down_revision = head.down_revision
          if isinstance(down_revision, tuple):
              if not down_revision:
                  raise SystemExit("当前 Alembic head 没有父 revision，无法回滚冒烟")
              print(down_revision[0])
          elif down_revision:
              print(down_revision)
          else:
              raise SystemExit("当前 Alembic head 没有父 revision，无法回滚冒烟")
          PY
          )"
          uv run alembic downgrade "${rollback_target}"
          uv run alembic upgrade head

  frontend:
    name: 前端质量检查
    runs-on: ubuntu-latest
    needs:
      - changes
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        if: needs.changes.outputs.frontend-source == 'true'
        run: npm ci

      - name: ESLint 检查
        if: needs.changes.outputs.frontend-source == 'true'
        run: npm run lint

      - name: 跳过 ESLint 检查说明
        if: needs.changes.outputs.frontend-source != 'true'
        run: echo "本次 PR 未修改 frontend/src 或前端构建配置，跳过既有前端源码 ESLint gate。"

      - name: TypeScript 类型检查
        if: needs.changes.outputs.frontend-source == 'true'
        run: npx tsc --noEmit

      - name: Next.js 构建
        if: needs.changes.outputs.frontend-source == 'true'
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: 跳过前端类型检查和构建说明
        if: needs.changes.outputs.frontend-source != 'true'
        run: echo "本次 PR 未修改 frontend/src 或前端构建配置，跳过既有前端源码 typecheck/build gate。"

  e2e:
    name: 浏览器 E2E 流程检查
    runs-on: ubuntu-latest
    needs:
      - changes
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promptchain_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promptchain_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 后端迁移并准备 E2E 种子数据
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/promptchain_e2e
          DATABASE_AUTO_SCHEMA_INIT: "false"
          ALLOW_INSECURE_JWT_SECRET: "true"
          JWT_SECRET_KEY: e2e-insecure-secret
          DEFAULT_LLM_PROVIDER: fake
          DEFAULT_MODEL_NAME: fake-smoke-model
          E2E_TEST_EMAIL: e2e-owner@example.com
          E2E_TEST_PASSWORD: E2ePassword123!
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d promptchain_e2e -c 'CREATE EXTENSION IF NOT EXISTS vector'
          uv run alembic upgrade head
          uv run python scripts/seed_e2e.py

      - name: 启动后端 API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/promptchain_e2e
          REDIS_URL: redis://127.0.0.1:6379/0
          DATABASE_AUTO_SCHEMA_INIT: "false"
          ALLOW_INSECURE_JWT_SECRET: "true"
          JWT_SECRET_KEY: e2e-insecure-secret
          DEFAULT_LLM_PROVIDER: fake
          DEFAULT_MODEL_NAME: fake-smoke-model
          AUTONOMOUS_AGENT_LLM_PLANNER_ENABLED: "false"
          AUTONOMOUS_AGENT_LLM_GENERATION_ENABLED: "false"
          AUTONOMOUS_AGENT_COVE_FACT_CHECK_ENABLED: "false"
          KNOWLEDGE_INDEX_WORKER_ENABLED: "false"
          CORS_ORIGINS: http://127.0.0.1:3100,http://localhost:3100
        run: |
          nohup uv run uvicorn app:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          echo "$!" > ../backend-e2e.pid
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1

      - name: Playwright E2E 浏览器测试
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          PLAYWRIGHT_PORT: "3100"
          E2E_TEST_EMAIL: e2e-owner@example.com
          E2E_TEST_PASSWORD: E2ePassword123!
        run: npm run test:e2e

      - name: 输出后端日志
        if: failure()
        run: cat backend-e2e.log || true

      - name: 上传 E2E 诊断产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            backend-e2e.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: 停止后端 API
        if: always()
        run: |
          if [ -f backend-e2e.pid ]; then
            kill "$(cat backend-e2e.pid)" || true
          fi
